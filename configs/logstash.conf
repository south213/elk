input {
  beats {
    port => 5044
  }
}

filter {
  # 添加日志来源标记
  mutate {
    add_field => { "source" => "task-management-system" }
  }
  
  # 解析时间戳
  date {
    match => [ "timestamp", "ISO8601" ]
  }
  
  # 添加标签
  mutate {
    add_tag => [ "flask", "python" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "task-management-logs-%{+YYYY.MM.dd}"
  }
  
  # 可选：输出到控制台用于调试
  stdout {
    codec => rubydebug
  }
}